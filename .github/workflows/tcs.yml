name: TimeCodeSecurity SAST

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tcs:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TCS
        run: |
          python tcs_cli.py . --format sarif -o tcs-results.sarif

      - name: Validate SARIF exists
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("tcs-results.sarif")
          assert p.exists(), "SARIF file was not created"

          data = json.loads(p.read_text(encoding="utf-8"))

          assert data["version"] == "2.1.0"
          assert "$schema" in data
          assert "runs" in data
          assert len(data["runs"]) == 1

          print("SARIF structure OK")
          print("Results:", len(data["runs"][0].get("results", [])))
          PY

      - name: Upload TCS SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tcs-results.sarif
          category: tcs
